name: Auto Sync Upstream

on:
  schedule:
    - cron: '7 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream into fork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          owner="${repo%%/*}"
          default_branch="${{ github.event.repository.default_branch }}"
          parent=$(gh api "/repos/$repo" --jq '.parent.full_name // empty')
          if [ -z "$parent" ]; then
            echo "No upstream parent configured; nothing to sync."
            exit 0
          fi

          upstream_branch=$(gh api "/repos/$repo" --jq '.parent.default_branch')
          compare=$(gh api "/repos/$parent/compare/$upstream_branch...$owner:$default_branch")
          behind=$(printf '%s' "$compare" | jq -r '.behind_by')
          ahead=$(printf '%s' "$compare" | jq -r '.ahead_by')
          status=$(printf '%s' "$compare" | jq -r '.status')
          echo "Pre-sync compare: status=$status ahead=$ahead behind=$behind"
          if [ "$behind" = "0" ]; then
            echo "Fork already contains the latest upstream commit."
            exit 0
          fi

          preserve_dir=$(mktemp -d)
          if [ -d .github/workflows ]; then
            cp -a .github/workflows "$preserve_dir/workflows"
          fi

          git remote remove upstream 2>/dev/null || true
          git remote add upstream "https://github.com/$parent.git"
          git fetch upstream "$upstream_branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git merge --no-commit --no-ff -X ours "upstream/$upstream_branch"; then
            if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
              echo "Resolving remaining conflicts in favor of fork customizations."
              git checkout --ours -- .
              git add -A
            else
              exit 1
            fi
          fi

          rm -rf .github/workflows
          if [ -d "$preserve_dir/workflows" ]; then
            mkdir -p .github
            cp -a "$preserve_dir/workflows" .github/workflows
          fi
          git add -A
          git commit -m "chore: merge upstream updates"
          git push origin HEAD:"$default_branch"

      - name: Verify upstream is absorbed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          owner="${repo%%/*}"
          parent=$(gh api "/repos/$repo" --jq '.parent.full_name // empty')
          [ -n "$parent" ] || exit 0
          default_branch="${{ github.event.repository.default_branch }}"
          upstream_branch=$(gh api "/repos/$repo" --jq '.parent.default_branch')
          behind=$(gh api "/repos/$parent/compare/$upstream_branch...$owner:$default_branch" --jq '.behind_by')
          if [ "$behind" != "0" ]; then
            echo "Fork remains $behind commit(s) behind upstream." >&2
            exit 1
          fi